name: Deploy Mini Program

on:
  workflow_dispatch:
    inputs:
      version:
        description: WeChat developer version
        required: true
        type: string
        default: 1.0.122
      description:
        description: Description shown in WeChat
        required: true
        type: string
        default: 我的作品可删除

permissions:
  contents: read

concurrency:
  group: mini-program-deploy
  cancel-in-progress: false

jobs:
  deploy-cloud-function:
    name: Deploy template-api backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
      TEMPLATE_API_ZIP: ${{ runner.temp }}/template-api-root.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check deployment credentials
        run: |
          test -n "$TENCENTCLOUD_SECRET_ID" || { echo "Missing GitHub secret TENCENTCLOUD_SECRET_ID"; exit 1; }
          test -n "$TENCENTCLOUD_SECRET_KEY" || { echo "Missing GitHub secret TENCENTCLOUD_SECRET_KEY"; exit 1; }

      - name: Install cloud function dependencies
        run: |
          sed -i 's|http://mirrors.tencent.com/npm/|https://registry.npmjs.org/|g' cf/template-api/package-lock.json
          npm ci --prefix cf/template-api --omit=dev --registry=https://registry.npmjs.org

      - name: Package cloud function
        run: |
          cd cf/template-api
          zip -qr "$TEMPLATE_API_ZIP" . -x "node_modules/.cache/*"

      - name: Install Tencent Cloud SDK
        run: python -m pip install tencentcloud-sdk-python-scf==3.1.100

      - name: Deploy cloud function
        run: python cf/deploy.py

  upload-mini-program:
    name: Upload WeChat developer version
    needs: deploy-cloud-function
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WECHAT_VERSION: ${{ inputs.version }}
      WECHAT_DESC: ${{ inputs.description }}
      WECHAT_PRIVATE_KEY_PATH: ${{ runner.temp }}/wechat-upload.key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mini program upload dependencies
        run: |
          sed -i 's|http://mirrors.tencent.com/npm/|https://registry.npmjs.org/|g' ci/package-lock.json
          npm ci --prefix ci --omit=dev --registry=https://registry.npmjs.org

      - name: Upload to WeChat
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          test -n "$WECHAT_PRIVATE_KEY" || { echo "Missing GitHub secret WECHAT_PRIVATE_KEY"; exit 1; }
          umask 077
          printf '%s' "$WECHAT_PRIVATE_KEY" > "$WECHAT_PRIVATE_KEY_PATH"
          trap 'rm -f "$WECHAT_PRIVATE_KEY_PATH"' EXIT
          node ci/upload.js
